version: '3.8'

services:
  elitea-capstone:
    build: .
    image: elitea-capstone-project:local
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: elitea
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
